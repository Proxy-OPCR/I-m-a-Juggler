<div id="jukebox">
  <img src="assets/images/panel_frame.png" class="panel-frame">

  <div class="reels">
    <canvas id="reel1" class="reel"></canvas>
    <canvas id="reel2" class="reel"></canvas>
    <canvas id="reel3" class="reel"></canvas>
  </div>

  <img src="assets/images/gogo_lamp.png" id="gogo-lamp" class="gogo-lamp">

  <div class="buttons">
    <button id="bet">BET</button>
    <button id="max">MAX BET</button>
    <button id="start">START</button>
    <button id="stop1">STOP 1</button>
    <button id="stop2">STOP 2</button>
    <button id="stop3">STOP 3</button>
  </div>

  <div class="display">
    <span id="credit">CREDIT: 100</span>
    <span id="bonus">BIG: 12 / REG: 3</span>
  </div>
</div>
